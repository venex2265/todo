<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TodoMe – Task dashboard</title>
  <meta name="description" content="A responsive task dashboard with a calendar, quick notes, focus timer and analytics.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Set the theme before first paint so there is no light/dark flash -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('todome:theme'); } catch (e) {}
      if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- SVG icon sprite (inline so it works from file:// and any host) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24"><path d="m9 11 3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  </svg>

  <div class="app" id="app">
    <aside class="sidebar">
      <a class="brand" href="#dashboard">
        <span class="brand__mark"><svg class="icon"><use href="#i-check-circle"/></svg></span>
        <span class="brand__name">TodoMe</span>
      </a>

      <nav class="nav" aria-label="Main navigation">
        <a class="nav__link" href="#dashboard" data-route="dashboard"><svg class="icon"><use href="#i-home"/></svg><span>Dashboard</span></a>
        <a class="nav__link" href="#tasks" data-route="tasks"><svg class="icon"><use href="#i-tasks"/></svg><span>My tasks</span></a>
        <a class="nav__link" href="#calendar" data-route="calendar"><svg class="icon"><use href="#i-calendar"/></svg><span>Calendar</span></a>
        <a class="nav__link" href="#analytics" data-route="analytics"><svg class="icon"><use href="#i-chart"/></svg><span>Analytics</span></a>
        <a class="nav__link" href="#settings" data-route="settings"><svg class="icon"><use href="#i-sliders"/></svg><span>Settings</span></a>
      </nav>

      <div class="progress-card">
        <strong>Today’s progress</strong>
        <div class="meter"><span id="progressBar"></span></div>
        <small id="progressText"></small>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <a class="topbar__brand" href="#dashboard" aria-label="TodoMe home">
          <span class="brand__mark"><svg class="icon"><use href="#i-check-circle"/></svg></span>
        </a>

        <div class="greeting">
          <h1 id="greeting"></h1>
          <p>Stay focused and get more done today.</p>
        </div>

        <div class="topbar__tools">
          <span class="today" id="today"></span>
          <input class="search" id="search" type="search" placeholder="Search tasks…" aria-label="Search tasks">
          <button class="icon-btn" id="searchToggle" type="button" aria-label="Search"><svg class="icon"><use href="#i-search"/></svg></button>
          <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle light and dark theme">
            <svg class="icon icon--sun"><use href="#i-sun"/></svg>
            <svg class="icon icon--moon"><use href="#i-moon"/></svg>
          </button>
          <div class="notif">
            <button class="icon-btn" id="notifToggle" type="button" aria-label="Notifications" aria-expanded="false">
              <svg class="icon"><use href="#i-bell"/></svg>
              <span class="badge" id="notifCount"></span>
            </button>
            <div class="popover" id="notifPanel" hidden></div>
          </div>
          <span class="avatar" id="avatar" aria-hidden="true"></span>
        </div>
      </header>

      <section class="stats" id="stats" data-views="dashboard analytics"></section>

      <div class="columns" data-views="dashboard tasks calendar">
        <section class="card" id="tasksCard" data-views="dashboard tasks calendar">
          <div class="card__head">
            <h2>My tasks</h2>
            <button class="btn" type="button" data-action="add-task"><svg class="icon"><use href="#i-plus"/></svg>Add task</button>
          </div>
          <div id="dayFilter"></div>
          <div class="tabs" id="tabs" role="tablist"></div>
          <div id="taskList"></div>
        </section>

        <div class="stack">
          <section class="card" data-views="dashboard calendar">
            <div class="calendar__head">
              <button class="icon-btn icon-btn--flat" type="button" data-action="prev-month" aria-label="Previous month"><svg class="icon"><use href="#i-left"/></svg></button>
              <h2 id="monthTitle"></h2>
              <button class="icon-btn icon-btn--flat" type="button" data-action="next-month" aria-label="Next month"><svg class="icon"><use href="#i-right"/></svg></button>
            </div>
            <div class="calendar" id="calendar"></div>
          </section>

          <section class="card" data-views="dashboard">
            <div class="card__head"><h2>Quick notes</h2></div>
            <div class="note-form">
              <input class="field" id="noteInput" type="text" placeholder="Write a quick note…" aria-label="Quick note">
              <button class="btn" type="button" data-action="add-note">Add</button>
            </div>
            <div id="noteList"></div>
          </section>
        </div>
      </div>

      <section class="card card--narrow" data-views="analytics">
        <div class="card__head"><h2>Analytics</h2></div>
        <div id="analytics"></div>
      </section>

      <section class="card card--narrow" data-views="settings">
        <div class="card__head"><h2>Settings</h2></div>
        <label class="label">Your name
          <input class="field" id="nameInput" type="text" maxlength="24">
        </label>
        <div class="actions actions--start">
          <button class="btn btn--soft" type="button" data-action="reset-focus">Reset focus time</button>
          <button class="btn btn--danger" type="button" data-action="reset-all">Delete all data</button>
        </div>
      </section>
    </main>
  </div>

  <dialog class="dialog" id="taskDialog">
    <form id="taskForm" method="dialog">
      <h2 id="dialogTitle">New task</h2>
      <label class="label">Title <input class="field" id="taskTitle" type="text" maxlength="80" required></label>
      <label class="label">Description <input class="field" id="taskDesc" type="text" maxlength="120"></label>
      <div class="grid-2">
        <label class="label">Priority
          <select class="field" id="taskPriority"><option>High</option><option selected>Medium</option><option>Low</option></select>
        </label>
        <label class="label">Due date <input class="field" id="taskDue" type="date" required></label>
      </div>
      <div class="actions">
        <button class="btn btn--soft" type="button" data-action="close-dialog">Cancel</button>
        <button class="btn" type="submit">Save task</button>
      </div>
    </form>
  </dialog>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
